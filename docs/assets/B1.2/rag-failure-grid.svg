<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" font-family="Inter, Arial, sans-serif">
  <rect width="640" height="480" fill="#ffffff"/>
  <text x="320" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">Why was this RAG answer bad?</text>
  <text x="335" y="56" text-anchor="middle" font-size="13" font-weight="600" fill="#4F46E5">DID THE ANSWER STICK TO THE RETRIEVED TEXT?</text>
  <text x="195" y="76" text-anchor="middle" font-size="13" font-weight="600" fill="#374151">Yes</text>
  <text x="475" y="76" text-anchor="middle" font-size="13" font-weight="600" fill="#374151">No</text>
  <text x="20" y="270" text-anchor="middle" font-size="13" font-weight="600" fill="#4F46E5" transform="rotate(-90 20 270)">WAS THE RIGHT TEXT RETRIEVED?</text>
  <text x="42" y="180" text-anchor="middle" font-size="13" font-weight="600" fill="#374151" transform="rotate(-90 42 180)">Yes</text>
  <text x="42" y="370" text-anchor="middle" font-size="13" font-weight="600" fill="#374151" transform="rotate(-90 42 370)">No</text>
  <rect x="55" y="88" width="280" height="180" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
  <rect x="335" y="88" width="280" height="180" rx="10" fill="#F3F4F6" stroke="#9CA3AF"/>
  <rect x="55" y="278" width="280" height="180" rx="10" fill="#F3F4F6" stroke="#9CA3AF"/>
  <rect x="335" y="278" width="280" height="180" rx="10" fill="#F3F4F6" stroke="#9CA3AF"/>
  <text x="195" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Working as designed</text>
  <text x="195" y="148" text-anchor="middle" font-size="13" fill="#374151">Right source, faithful answer</text>
  <text x="195" y="168" text-anchor="middle" font-size="13" fill="#374151">Still check: is it helpful,</text>
  <text x="195" y="188" text-anchor="middle" font-size="13" fill="#374151">clear and fast enough?</text>
  <text x="195" y="246" text-anchor="middle" font-size="12" font-style="italic" fill="#4F46E5">Goal: most answers here</text>
  <text x="475" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Generation failure</text>
  <text x="475" y="148" text-anchor="middle" font-size="13" fill="#374151">Had the page, ignored or</text>
  <text x="475" y="168" text-anchor="middle" font-size="13" fill="#374151">twisted it ("7 working days"</text>
  <text x="475" y="188" text-anchor="middle" font-size="13" fill="#374151">became "7 days")</text>
  <text x="475" y="246" text-anchor="middle" font-size="12" font-style="italic" fill="#6B7280">Fix: prompt rules, citations, model</text>
  <text x="195" y="308" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Honest miss</text>
  <text x="195" y="338" text-anchor="middle" font-size="13" fill="#374151">Wrong or no page found,</text>
  <text x="195" y="358" text-anchor="middle" font-size="13" fill="#374151">so it says "I couldn't find</text>
  <text x="195" y="378" text-anchor="middle" font-size="13" fill="#374151">this" and offers a human</text>
  <text x="195" y="436" text-anchor="middle" font-size="12" font-style="italic" fill="#6B7280">Fix: content gaps, search quality</text>
  <text x="475" y="308" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Confident wrong answer</text>
  <text x="475" y="338" text-anchor="middle" font-size="13" fill="#374151">Wrong page found, and the</text>
  <text x="475" y="358" text-anchor="middle" font-size="13" fill="#374151">model answers anyway from</text>
  <text x="475" y="378" text-anchor="middle" font-size="13" fill="#374151">it or from memory</text>
  <text x="475" y="436" text-anchor="middle" font-size="12" font-style="italic" fill="#4F46E5">Worst case: fix search AND rules</text>
</svg>
