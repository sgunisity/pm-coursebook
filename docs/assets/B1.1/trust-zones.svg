<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="Inter, Arial, sans-serif">
  <rect width="640" height="440" fill="#ffffff"/>
  <text x="320" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">Trusted instructions vs untrusted text</text>
  <rect x="30" y="50" width="250" height="170" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
  <text x="155" y="78" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">Trusted (your team)</text>
  <text x="155" y="110" text-anchor="middle" font-size="13" fill="#374151">System prompt</text>
  <text x="155" y="132" text-anchor="middle" font-size="13" fill="#374151">Approved policy documents</text>
  <text x="155" y="154" text-anchor="middle" font-size="13" fill="#374151">Tool definitions</text>
  <text x="155" y="196" text-anchor="middle" font-size="12" font-style="italic" fill="#4F46E5">Treat as instructions</text>
  <rect x="360" y="50" width="250" height="170" rx="12" fill="#F3F4F6" stroke="#9CA3AF" stroke-dasharray="6 4"/>
  <text x="485" y="78" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">Untrusted (outside)</text>
  <text x="485" y="110" text-anchor="middle" font-size="13" fill="#374151">User messages</text>
  <text x="485" y="132" text-anchor="middle" font-size="13" fill="#374151">Web pages, emails, PDFs</text>
  <text x="485" y="154" text-anchor="middle" font-size="13" fill="#374151">Reviews, uploaded files</text>
  <text x="485" y="196" text-anchor="middle" font-size="12" font-style="italic" fill="#6B7280">Treat as data; may hide instructions</text>
  <line x1="155" y1="220" x2="300" y2="262" stroke="#4F46E5" stroke-width="2"/>
  <line x1="485" y1="220" x2="340" y2="262" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="220" y="262" width="200" height="50" rx="10" fill="#F9FAFB" stroke="#374151"/>
  <text x="320" y="292" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">AI model</text>
  <line x1="320" y1="312" x2="320" y2="340" stroke="#374151" stroke-width="2"/>
  <rect x="150" y="340" width="340" height="48" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
  <text x="320" y="362" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">Checks in code</text>
  <text x="320" y="379" text-anchor="middle" font-size="12" fill="#374151">format · permissions · limits · human approval</text>
  <line x1="320" y1="388" x2="320" y2="410" stroke="#374151" stroke-width="2"/>
  <text x="320" y="428" text-anchor="middle" font-size="13" fill="#111827">Reply or action</text>
</svg>
