<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="Inter, Arial, sans-serif" role="img" aria-label="Persona card linked to three job stories with their forces">
  <rect width="760" height="440" fill="#ffffff"/>
  <!-- Persona card -->
  <rect x="20" y="20" width="250" height="400" rx="10" fill="#F3F4F6" stroke="#9CA3AF"/>
  <rect x="20" y="20" width="250" height="44" rx="10" fill="#4F46E5"/>
  <rect x="20" y="50" width="250" height="14" fill="#4F46E5"/>
  <text x="145" y="48" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">PERSONA: Sunita</text>
  <text x="36" y="92" font-size="12" font-weight="700" fill="#111827">Context</text>
  <text x="36" y="110" font-size="11" fill="#374151">Budget Android, evenings after work</text>
  <text x="36" y="140" font-size="12" font-weight="700" fill="#111827">Goals</text>
  <text x="36" y="158" font-size="11" fill="#374151">Save regularly without losing money</text>
  <text x="36" y="188" font-size="12" font-weight="700" fill="#111827">Behaviours</text>
  <text x="36" y="206" font-size="11" fill="#374151">Uses FDs; asks family before deciding</text>
  <text x="36" y="236" font-size="12" font-weight="700" fill="#111827">Frustrations</text>
  <text x="36" y="254" font-size="11" fill="#374151">Jargon; fear of the wrong button</text>
  <text x="36" y="284" font-size="12" font-weight="700" fill="#111827">Quote</text>
  <text x="36" y="302" font-size="11" font-style="italic" fill="#374151">"I don't want to feel stupid asking."</text>
  <rect x="36" y="330" width="218" height="72" rx="6" fill="#ffffff" stroke="#9CA3AF" stroke-dasharray="4 3"/>
  <text x="145" y="356" text-anchor="middle" font-size="11" fill="#6B7280">Every line traced to</text>
  <text x="145" y="374" text-anchor="middle" font-size="11" fill="#6B7280">interview notes, or marked</text>
  <text x="145" y="392" text-anchor="middle" font-size="11" fill="#6B7280">"assumption"</text>
  <!-- Connectors -->
  <line x1="270" y1="220" x2="320" y2="85" stroke="#4F46E5" stroke-width="2"/>
  <line x1="270" y1="220" x2="320" y2="220" stroke="#4F46E5" stroke-width="2"/>
  <line x1="270" y1="220" x2="320" y2="355" stroke="#4F46E5" stroke-width="2"/>
  <!-- Job 1 -->
  <rect x="320" y="30" width="420" height="115" rx="10" fill="#ffffff" stroke="#4F46E5" stroke-width="2"/>
  <text x="336" y="54" font-size="13" font-weight="700" fill="#4F46E5">Job A (primary): start a saving habit</text>
  <text x="336" y="76" font-size="11" fill="#374151">When I get my first salary, I want to save automatically,</text>
  <text x="336" y="92" font-size="11" fill="#374151">so I can stop feeling guilty about spending it all.</text>
  <rect x="336" y="104" width="92" height="28" rx="5" fill="#E5E7EB"/><text x="382" y="122" text-anchor="middle" font-size="10" fill="#111827">Push: guilt</text>
  <rect x="434" y="104" width="92" height="28" rx="5" fill="#E5E7EB"/><text x="480" y="122" text-anchor="middle" font-size="10" fill="#111827">Pull: autopilot</text>
  <rect x="532" y="104" width="100" height="28" rx="5" fill="#4F46E5"/><text x="582" y="122" text-anchor="middle" font-size="10" fill="#ffffff">Anxiety: stuck?</text>
  <rect x="638" y="104" width="90" height="28" rx="5" fill="#E5E7EB"/><text x="683" y="122" text-anchor="middle" font-size="10" fill="#111827">Habit: FDs</text>
  <!-- Job 2 -->
  <rect x="320" y="165" width="420" height="110" rx="10" fill="#ffffff" stroke="#9CA3AF"/>
  <text x="336" y="189" font-size="13" font-weight="700" fill="#111827">Job B: beat the FD</text>
  <text x="336" y="211" font-size="11" fill="#374151">When I see my FD earning little, I want idle money to grow,</text>
  <text x="336" y="227" font-size="11" fill="#374151">so I can reach a goal sooner.</text>
  <rect x="336" y="238" width="190" height="26" rx="5" fill="#E5E7EB"/><text x="431" y="255" text-anchor="middle" font-size="10" fill="#111827">Biggest blocker: fear of losses</text>
  <!-- Job 3 -->
  <rect x="320" y="295" width="420" height="115" rx="10" fill="#ffffff" stroke="#9CA3AF"/>
  <text x="336" y="319" font-size="13" font-weight="700" fill="#111827">Job C: save tax before March</text>
  <text x="336" y="341" font-size="11" fill="#374151">When HR asks for tax proofs, I want a quick tax-saving</text>
  <text x="336" y="357" font-size="11" fill="#374151">investment, so I can submit on time.</text>
  <rect x="336" y="370" width="190" height="26" rx="5" fill="#E5E7EB"/><text x="431" y="387" text-anchor="middle" font-size="10" fill="#111827">Biggest blocker: deadline rush</text>
</svg>
