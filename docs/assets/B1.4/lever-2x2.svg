<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" font-family="Inter, Arial, sans-serif">
  <rect width="640" height="500" fill="#ffffff"/>
  <text x="330" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">Which lever fixes your failures?</text>
  <!-- vertical axis -->
  <line x1="50" y1="440" x2="50" y2="60" stroke="#4F46E5" stroke-width="2"/>
  <polygon points="44,66 56,66 50,52" fill="#4F46E5"/>
  <text x="26" y="250" text-anchor="middle" font-size="13" font-weight="600" fill="#4F46E5" transform="rotate(-90 26 250)">Needs more KNOWLEDGE  (context)</text>
  <!-- horizontal axis -->
  <line x1="50" y1="440" x2="620" y2="440" stroke="#4F46E5" stroke-width="2"/>
  <polygon points="614,434 614,446 628,440" fill="#4F46E5"/>
  <text x="335" y="470" text-anchor="middle" font-size="13" font-weight="600" fill="#4F46E5">Needs different BEHAVIOUR  (the model itself)</text>
  <!-- quadrants -->
  <rect x="65" y="65" width="265" height="175" rx="10" fill="#F3F4F6" stroke="#9CA3AF"/>
  <rect x="345" y="65" width="265" height="175" rx="10" fill="#F3F4F6" stroke="#9CA3AF"/>
  <rect x="65" y="252" width="265" height="175" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
  <rect x="345" y="252" width="265" height="175" rx="10" fill="#F3F4F6" stroke="#9CA3AF"/>
  <!-- top-left -->
  <text x="197" y="97" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Prompt + RAG / tools</text>
  <text x="197" y="125" text-anchor="middle" font-size="13" fill="#374151">Old or missing facts</text>
  <text x="197" y="145" text-anchor="middle" font-size="13" fill="#374151">Private documents</text>
  <text x="197" y="165" text-anchor="middle" font-size="13" fill="#374151">Live data (order status)</text>
  <text x="197" y="215" text-anchor="middle" font-size="12" font-style="italic" fill="#6B7280">Update a document, not the model</text>
  <!-- top-right -->
  <text x="477" y="97" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">All three, stacked</text>
  <text x="477" y="125" text-anchor="middle" font-size="13" fill="#374151">Private knowledge AND a</text>
  <text x="477" y="145" text-anchor="middle" font-size="13" fill="#374151">strict behaviour at high volume</text>
  <text x="477" y="215" text-anchor="middle" font-size="12" font-style="italic" fill="#6B7280">Train on RAG-shaped inputs; re-test</text>
  <!-- bottom-left -->
  <text x="197" y="284" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Prompting</text>
  <text x="197" y="312" text-anchor="middle" font-size="13" fill="#374151">Clear task, rules with reasons,</text>
  <text x="197" y="332" text-anchor="middle" font-size="13" fill="#374151">varied examples, output format</text>
  <text x="197" y="400" text-anchor="middle" font-size="12" font-style="italic" fill="#4F46E5">Start here. Build your eval baseline.</text>
  <!-- bottom-right -->
  <text x="477" y="284" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Prompt + fine-tuning</text>
  <text x="477" y="312" text-anchor="middle" font-size="13" fill="#374151">Format or tone keeps drifting</text>
  <text x="477" y="332" text-anchor="middle" font-size="13" fill="#374151">Narrow task, huge volume</text>
  <text x="477" y="352" text-anchor="middle" font-size="13" fill="#374151">Need a small, fast model</text>
  <text x="477" y="400" text-anchor="middle" font-size="12" font-style="italic" fill="#6B7280">Pays off through volume</text>
</svg>
