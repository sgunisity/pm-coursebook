<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" font-family="Inter, Arial, sans-serif">
  <rect width="640" height="480" fill="#ffffff"/>
  <text x="320" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">Pick a research method by the question you have</text>
  <text x="195" y="62" text-anchor="middle" font-size="13" font-weight="600" fill="#4F46E5">WHY? (qualitative)</text>
  <text x="475" y="62" text-anchor="middle" font-size="13" font-weight="600" fill="#4F46E5">HOW MANY? (quantitative)</text>
  <text x="22" y="165" text-anchor="middle" font-size="13" font-weight="600" fill="#4F46E5" transform="rotate(-90 22 165)">WHAT THEY SAY</text>
  <text x="38" y="165" text-anchor="middle" font-size="10" fill="#6B7280" transform="rotate(-90 38 165)">attitudinal</text>
  <text x="22" y="355" text-anchor="middle" font-size="13" font-weight="600" fill="#4F46E5" transform="rotate(-90 22 355)">WHAT THEY DO</text>
  <text x="38" y="355" text-anchor="middle" font-size="10" fill="#6B7280" transform="rotate(-90 38 355)">behavioural</text>
  <rect x="55" y="75" width="280" height="180" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
  <rect x="335" y="75" width="280" height="180" rx="10" fill="#F3F4F6" stroke="#9CA3AF"/>
  <rect x="55" y="265" width="280" height="180" rx="10" fill="#F3F4F6" stroke="#9CA3AF"/>
  <rect x="335" y="265" width="280" height="180" rx="10" fill="#F3F4F6" stroke="#9CA3AF"/>
  <text x="195" y="105" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Understand needs</text>
  <text x="195" y="135" text-anchor="middle" font-size="13" fill="#374151">Story-based interviews</text>
  <text x="195" y="155" text-anchor="middle" font-size="13" fill="#374151">Diary studies</text>
  <text x="195" y="175" text-anchor="middle" font-size="13" fill="#374151">Concept discussions</text>
  <text x="195" y="232" text-anchor="middle" font-size="12" font-style="italic" fill="#4F46E5">Ask about past events, not the future</text>
  <text x="475" y="105" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Size and track opinions</text>
  <text x="475" y="135" text-anchor="middle" font-size="13" fill="#374151">Surveys</text>
  <text x="475" y="155" text-anchor="middle" font-size="13" fill="#374151">Satisfaction scores (CSAT, NPS)</text>
  <text x="475" y="175" text-anchor="middle" font-size="13" fill="#374151">Tagged reviews and tickets</text>
  <text x="475" y="232" text-anchor="middle" font-size="12" font-style="italic" fill="#6B7280">Count what interviews found</text>
  <text x="195" y="295" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Watch real behaviour</text>
  <text x="195" y="325" text-anchor="middle" font-size="13" fill="#374151">Usability tests (think-aloud)</text>
  <text x="195" y="345" text-anchor="middle" font-size="13" fill="#374151">Field visits, contextual inquiry</text>
  <text x="195" y="365" text-anchor="middle" font-size="13" fill="#374151">Session recordings</text>
  <text x="195" y="422" text-anchor="middle" font-size="12" font-style="italic" fill="#6B7280">See where people struggle</text>
  <text x="475" y="295" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Measure behaviour at scale</text>
  <text x="475" y="325" text-anchor="middle" font-size="13" fill="#374151">Analytics and funnels</text>
  <text x="475" y="345" text-anchor="middle" font-size="13" fill="#374151">A/B tests</text>
  <text x="475" y="365" text-anchor="middle" font-size="13" fill="#374151">Benchmark usability metrics</text>
  <text x="475" y="422" text-anchor="middle" font-size="12" font-style="italic" fill="#6B7280">Prove what works, and by how much</text>
  <text x="320" y="470" text-anchor="middle" font-size="11" fill="#6B7280">Simplified from the three-dimension method map in NN/g's "When to Use Which UX Research Methods"</text>
</svg>
