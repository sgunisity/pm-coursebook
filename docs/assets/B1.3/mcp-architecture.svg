<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="Inter, Arial, sans-serif" role="img" aria-label="MCP architecture: one host with three clients connected to three MCP servers">
  <rect width="760" height="430" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4F46E5"/>
    </marker>
  </defs>
  <!-- User -->
  <rect x="20" y="180" width="90" height="60" rx="8" fill="#F3F4F6" stroke="#9CA3AF"/>
  <text x="65" y="215" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">User</text>
  <line x1="110" y1="210" x2="148" y2="210" stroke="#4F46E5" stroke-width="2" marker-end="url(#arr)" marker-start="url(#arr)"/>
  <!-- Host -->
  <rect x="150" y="20" width="270" height="390" rx="12" fill="#F3F4F6" stroke="#9CA3AF"/>
  <text x="285" y="48" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">HOST: the AI app</text>
  <text x="285" y="66" text-anchor="middle" font-size="11" fill="#6B7280">(chat app, IDE, your product)</text>
  <rect x="170" y="80" width="230" height="44" rx="8" fill="#ffffff" stroke="#9CA3AF"/>
  <text x="285" y="107" text-anchor="middle" font-size="12" fill="#111827">Model + agent loop</text>
  <rect x="170" y="134" width="230" height="44" rx="8" fill="#4F46E5"/>
  <text x="285" y="153" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Approval gate</text>
  <text x="285" y="169" text-anchor="middle" font-size="10" fill="#ffffff">limits, permissions, ask the user</text>
  <rect x="190" y="200" width="190" height="50" rx="8" fill="#ffffff" stroke="#4F46E5"/>
  <text x="285" y="230" text-anchor="middle" font-size="12" fill="#111827">Client 1</text>
  <rect x="190" y="268" width="190" height="50" rx="8" fill="#ffffff" stroke="#4F46E5"/>
  <text x="285" y="298" text-anchor="middle" font-size="12" fill="#111827">Client 2</text>
  <rect x="190" y="336" width="190" height="50" rx="8" fill="#ffffff" stroke="#4F46E5"/>
  <text x="285" y="366" text-anchor="middle" font-size="12" fill="#111827">Client 3</text>
  <!-- Arrows -->
  <line x1="380" y1="225" x2="478" y2="95" stroke="#4F46E5" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="380" y1="293" x2="478" y2="225" stroke="#4F46E5" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="380" y1="361" x2="478" y2="355" stroke="#4F46E5" stroke-width="2" marker-end="url(#arr)"/>
  <text x="428" y="168" text-anchor="middle" font-size="10" fill="#6B7280">MCP</text>
  <!-- Servers -->
  <rect x="480" y="40" width="260" height="110" rx="10" fill="#ffffff" stroke="#9CA3AF"/>
  <text x="496" y="64" font-size="13" font-weight="700" fill="#111827">Server: Orders</text>
  <text x="496" y="86" font-size="11" fill="#374151">Tools: lookup_order, track_shipment</text>
  <text x="496" y="104" font-size="11" fill="#374151">Resources: order history</text>
  <text x="496" y="122" font-size="11" fill="#374151">Prompts: "summarise my orders"</text>
  <text x="496" y="140" font-size="10" fill="#6B7280">Read-only: low risk</text>
  <rect x="480" y="170" width="260" height="110" rx="10" fill="#ffffff" stroke="#4F46E5" stroke-width="2"/>
  <text x="496" y="194" font-size="13" font-weight="700" fill="#4F46E5">Server: Payments</text>
  <text x="496" y="216" font-size="11" fill="#374151">Tools: issue_refund</text>
  <text x="496" y="234" font-size="11" fill="#374151">Resources: refund policy</text>
  <text x="496" y="252" font-size="11" fill="#374151">Writes money: needs limits</text>
  <text x="496" y="270" font-size="10" fill="#6B7280">and human approval above a cap</text>
  <rect x="480" y="300" width="260" height="110" rx="10" fill="#ffffff" stroke="#9CA3AF"/>
  <text x="496" y="324" font-size="13" font-weight="700" fill="#111827">Server: Knowledge base</text>
  <text x="496" y="346" font-size="11" fill="#374151">Tools: search_help_articles</text>
  <text x="496" y="364" font-size="11" fill="#374151">Resources: FAQ pages</text>
  <text x="496" y="382" font-size="11" fill="#374151">Untrusted text can hide</text>
  <text x="496" y="400" font-size="10" fill="#6B7280">injected instructions</text>
</svg>
