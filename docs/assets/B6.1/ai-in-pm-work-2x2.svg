<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" font-family="Inter, Arial, sans-serif">
  <rect width="640" height="500" fill="#ffffff"/>
  <text x="340" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">Where AI fits in your own PM work</text>
  <text x="340" y="485" text-anchor="middle" font-size="12" font-weight="600" fill="#374151">Cost of a mistake →  (low  …  high)</text>
  <text x="22" y="260" text-anchor="middle" font-size="12" font-weight="600" fill="#374151" transform="rotate(-90 22 260)">How easy to check the output →  (hard  …  easy)</text>
  <!-- top-left -->
  <rect x="50" y="45" width="285" height="205" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
  <text x="192" y="75" text-anchor="middle" font-size="15" font-weight="700" fill="#4F46E5">Let AI do it</text>
  <g font-size="12" fill="#374151" text-anchor="middle">
    <text x="192" y="105">Meeting summaries</text>
    <text x="192" y="125">Formatting tickets</text>
    <text x="192" y="145">Rewording your own notes</text>
    <text x="192" y="225" font-size="11" fill="#6B7280">Cheap mistakes, easy to spot</text>
  </g>
  <!-- top-right -->
  <rect x="345" y="45" width="285" height="205" rx="10" fill="#F3F4F6" stroke="#9CA3AF"/>
  <text x="487" y="75" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">AI drafts, you verify</text>
  <g font-size="12" fill="#374151" text-anchor="middle">
    <text x="487" y="105">PRD and spec drafts</text>
    <text x="487" y="125">SQL for data pulls</text>
    <text x="487" y="145">Interview synthesis (with sources)</text>
    <text x="487" y="165">Stakeholder updates</text>
    <text x="487" y="225" font-size="11" fill="#6B7280">Check every fact before sharing</text>
  </g>
  <!-- bottom-left -->
  <rect x="50" y="260" width="285" height="205" rx="10" fill="#F3F4F6" stroke="#9CA3AF"/>
  <text x="192" y="290" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Explore with AI</text>
  <g font-size="12" fill="#374151" text-anchor="middle">
    <text x="192" y="320">Brainstorming ideas</text>
    <text x="192" y="340">Naming and copy options</text>
    <text x="192" y="360">Early competitor scans</text>
    <text x="192" y="440" font-size="11" fill="#6B7280">Treat output as leads, not facts</text>
  </g>
  <!-- bottom-right -->
  <rect x="345" y="260" width="285" height="205" rx="10" fill="#ffffff" stroke="#4F46E5" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="487" y="290" text-anchor="middle" font-size="15" font-weight="700" fill="#4F46E5">Keep it yourself</text>
  <g font-size="12" fill="#374151" text-anchor="middle">
    <text x="487" y="320">Prioritisation and roadmap calls</text>
    <text x="487" y="340">Pricing and launch decisions</text>
    <text x="487" y="360">Feedback on people</text>
    <text x="487" y="380">Promises to customers</text>
    <text x="487" y="440" font-size="11" fill="#6B7280">AI can critique; you decide</text>
  </g>
</svg>
