<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" font-family="Inter, Arial, sans-serif">
  <rect width="640" height="470" fill="#ffffff"/>
  <text x="320" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">Four windows into your users</text>
  <text x="190" y="62" text-anchor="middle" font-size="13" font-weight="600" fill="#4F46E5">WHAT THEY SAY</text>
  <text x="470" y="62" text-anchor="middle" font-size="13" font-weight="600" fill="#4F46E5">WHAT THEY DO</text>
  <text x="22" y="160" text-anchor="middle" font-size="13" font-weight="600" fill="#4F46E5" transform="rotate(-90 22 160)">FIRSTHAND</text>
  <text x="38" y="160" text-anchor="middle" font-size="10" fill="#6B7280" transform="rotate(-90 38 160)">you are there</text>
  <text x="22" y="345" text-anchor="middle" font-size="13" font-weight="600" fill="#4F46E5" transform="rotate(-90 22 345)">SECONDHAND</text>
  <text x="38" y="345" text-anchor="middle" font-size="10" fill="#6B7280" transform="rotate(-90 38 345)">via data or others</text>
  <rect x="50" y="75" width="280" height="180" rx="10" fill="#F3F4F6" stroke="#9CA3AF"/>
  <rect x="330" y="75" width="280" height="180" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
  <rect x="50" y="265" width="280" height="180" rx="10" fill="#F3F4F6" stroke="#9CA3AF"/>
  <rect x="330" y="265" width="280" height="180" rx="10" fill="#F3F4F6" stroke="#9CA3AF"/>
  <text x="190" y="105" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Conversations</text>
  <text x="190" y="135" text-anchor="middle" font-size="13" fill="#374151">User interviews</text>
  <text x="190" y="155" text-anchor="middle" font-size="13" fill="#374151">Think-aloud usability tests</text>
  <text x="190" y="175" text-anchor="middle" font-size="13" fill="#374151">Sales and support calls you join</text>
  <text x="190" y="230" text-anchor="middle" font-size="12" font-style="italic" fill="#6B7280">Shows motives; beware the say-do gap</text>
  <text x="470" y="105" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Observation in context</text>
  <text x="470" y="135" text-anchor="middle" font-size="13" fill="#374151">Follow-me-home visits</text>
  <text x="470" y="155" text-anchor="middle" font-size="13" fill="#374151">Shadowing a user at work</text>
  <text x="470" y="175" text-anchor="middle" font-size="13" fill="#374151">Doing the job yourself for a day</text>
  <text x="470" y="230" text-anchor="middle" font-size="12" font-style="italic" fill="#4F46E5">Rarest, and usually most surprising</text>
  <text x="190" y="295" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Feedback at scale</text>
  <text x="190" y="325" text-anchor="middle" font-size="13" fill="#374151">Support tickets, app reviews</text>
  <text x="190" y="345" text-anchor="middle" font-size="13" fill="#374151">Surveys, social media</text>
  <text x="190" y="365" text-anchor="middle" font-size="13" fill="#374151">Notes from sales teams</text>
  <text x="190" y="420" text-anchor="middle" font-size="12" font-style="italic" fill="#6B7280">Cheap and constant; skews to loud users</text>
  <text x="470" y="295" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Behaviour data</text>
  <text x="470" y="325" text-anchor="middle" font-size="13" fill="#374151">Analytics and funnels</text>
  <text x="470" y="345" text-anchor="middle" font-size="13" fill="#374151">Session recordings</text>
  <text x="470" y="365" text-anchor="middle" font-size="13" fill="#374151">Experiment results</text>
  <text x="470" y="420" text-anchor="middle" font-size="12" font-style="italic" fill="#6B7280">Shows what and how much, rarely why</text>
</svg>
