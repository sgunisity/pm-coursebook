<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" font-family="Inter, Arial, sans-serif">
  <rect width="640" height="520" fill="#ffffff"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">The why–how ladder: framing at the right altitude</text>
  <line x1="60" y1="460" x2="60" y2="70" stroke="#4F46E5" stroke-width="2"/>
  <polygon points="54,76 66,76 60,60" fill="#4F46E5"/>
  <text x="38" y="270" text-anchor="middle" font-size="14" font-weight="700" fill="#4F46E5" transform="rotate(-90 38 270)">Ask "Why?" to climb up (broader)</text>
  <line x1="590" y1="70" x2="590" y2="460" stroke="#6B7280" stroke-width="2"/>
  <polygon points="584,454 596,454 590,470" fill="#6B7280"/>
  <text x="614" y="270" text-anchor="middle" font-size="14" font-weight="700" fill="#6B7280" transform="rotate(90 614 270)">Ask "How?" to climb down (narrower)</text>
  <rect x="90" y="70" width="470" height="62" rx="10" fill="#F3F4F6" stroke="#9CA3AF"/>
  <text x="325" y="98" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">Help aspirants clear their exam</text>
  <text x="325" y="118" text-anchor="middle" font-size="11" font-style="italic" fill="#6B7280">Too broad: no single team can own it</text>
  <rect x="90" y="148" width="470" height="62" rx="10" fill="#F3F4F6" stroke="#9CA3AF"/>
  <text x="325" y="176" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">Keep aspirants practising after week 1</text>
  <text x="325" y="196" text-anchor="middle" font-size="11" font-style="italic" fill="#6B7280">Still broad: many different causes</text>
  <rect x="90" y="226" width="470" height="70" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="3"/>
  <text x="325" y="256" text-anchor="middle" font-size="14" font-weight="700" fill="#4F46E5">Help low scorers on their first mock know what to fix first</text>
  <text x="325" y="278" text-anchor="middle" font-size="11" font-weight="600" fill="#4F46E5">Sweet spot: specific, ownable, open to many solutions</text>
  <rect x="90" y="312" width="470" height="62" rx="10" fill="#F3F4F6" stroke="#9CA3AF"/>
  <text x="325" y="340" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">Show a personalised 7-day fix plan</text>
  <text x="325" y="360" text-anchor="middle" font-size="11" font-style="italic" fill="#6B7280">One possible solution</text>
  <rect x="90" y="390" width="470" height="62" rx="10" fill="#ffffff" stroke="#111827" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="325" y="418" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">Add a leaderboard</text>
  <text x="325" y="438" text-anchor="middle" font-size="11" font-style="italic" fill="#6B7280">The request as received: a solution in disguise</text>
  <text x="325" y="495" text-anchor="middle" font-size="12" fill="#374151">Example from the worked example: an exam-prep app</text>
</svg>
