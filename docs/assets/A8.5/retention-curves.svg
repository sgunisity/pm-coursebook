<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Inter, Arial, sans-serif">
  <rect width="640" height="400" fill="#ffffff"/>
  <text x="320" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">Three shapes of retention curve</text>
  <!-- axes -->
  <line x1="70" y1="330" x2="600" y2="330" stroke="#9CA3AF" stroke-width="1.5"/>
  <line x1="70" y1="60" x2="70" y2="330" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="335" y="365" text-anchor="middle" font-size="13" fill="#374151">Months since sign-up →</text>
  <text x="30" y="195" text-anchor="middle" font-size="13" fill="#374151" transform="rotate(-90 30 195)">% of cohort still active</text>
  <text x="62" y="66" text-anchor="end" font-size="11" fill="#6B7280">100%</text>
  <text x="62" y="334" text-anchor="end" font-size="11" fill="#6B7280">0%</text>
  <!-- curve 1: falls to zero -->
  <path d="M70,62 C140,200 220,290 330,316 C430,326 520,327 600,327" fill="none" stroke="#9CA3AF" stroke-width="3" stroke-dasharray="7 5"/>
  <!-- curve 2: flattens -->
  <path d="M70,62 C120,170 180,215 260,228 S480,236 600,238" fill="none" stroke="#4F46E5" stroke-width="3"/>
  <!-- curve 3: smile -->
  <path d="M70,62 C110,150 170,190 250,200 C340,206 450,190 600,165" fill="none" stroke="#111827" stroke-width="3"/>
  <!-- labels -->
  <rect x="400" y="282" width="190" height="24" rx="5" fill="#F3F4F6"/>
  <text x="495" y="299" text-anchor="middle" font-size="12" fill="#374151">Falls to zero: no fit yet</text>
  <rect x="400" y="242" width="190" height="24" rx="5" fill="#EEF2FF"/>
  <text x="495" y="259" text-anchor="middle" font-size="12" fill="#4F46E5" font-weight="600">Flattens: a loyal core</text>
  <rect x="400" y="136" width="190" height="24" rx="5" fill="#E5E7EB"/>
  <text x="495" y="153" text-anchor="middle" font-size="12" fill="#111827" font-weight="600">Smile: users come back</text>
</svg>
