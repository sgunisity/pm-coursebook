<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" font-family="Inter, Arial, sans-serif">
  <rect width="640" height="480" fill="#ffffff"/>
  <text x="320" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">AI production scorecard (wireframe)</text>

  <!-- Steering metric -->
  <rect x="20" y="45" width="600" height="80" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
  <text x="40" y="72" font-size="13" font-weight="700" fill="#4F46E5">STEERING: True resolution</text>
  <text x="40" y="105" font-size="28" font-weight="700" fill="#111827">67%</text>
  <text x="120" y="105" font-size="12" fill="#374151">English 70% · Hindi 63%</text>
  <polyline points="420,105 450,98 480,100 510,90 540,92 570,85 600,88" fill="none" stroke="#4F46E5" stroke-width="2"/>
  <text x="510" y="72" font-size="11" fill="#6B7280">last 7 days</text>

  <!-- Guardrail tiles -->
  <g font-size="12" fill="#374151">
    <rect x="20" y="140" width="140" height="80" rx="8" fill="#F3F4F6" stroke="#9CA3AF"/>
    <text x="32" y="162" font-weight="700" fill="#111827">Quality</text>
    <text x="32" y="186">Policy followed</text>
    <text x="32" y="207" font-size="16" font-weight="700" fill="#111827">92%</text>

    <rect x="173" y="140" width="140" height="80" rx="8" fill="#F3F4F6" stroke="#9CA3AF"/>
    <text x="185" y="162" font-weight="700" fill="#111827">Cost</text>
    <text x="185" y="186">Per resolved issue</text>
    <text x="185" y="207" font-size="16" font-weight="700" fill="#111827">₹1.80</text>

    <rect x="326" y="140" width="140" height="80" rx="8" fill="#F3F4F6" stroke="#9CA3AF"/>
    <text x="338" y="162" font-weight="700" fill="#111827">Speed</text>
    <text x="338" y="186">TTFT p50 / p95</text>
    <text x="338" y="207" font-size="16" font-weight="700" fill="#111827">0.9 s / 3.1 s</text>

    <rect x="479" y="140" width="141" height="80" rx="8" fill="#F3F4F6" stroke="#9CA3AF"/>
    <text x="491" y="162" font-weight="700" fill="#111827">Safety</text>
    <text x="491" y="186">Guardrail triggers</text>
    <text x="491" y="207" font-size="16" font-weight="700" fill="#111827">0.4%</text>
  </g>

  <!-- Scoreboard row -->
  <rect x="20" y="235" width="600" height="40" rx="8" fill="#F9FAFB" stroke="#D1D5DB"/>
  <text x="32" y="260" font-size="12" fill="#374151"><tspan font-weight="700" fill="#111827">Scoreboard:</tspan> support cost per order · containment · model v3 (pinned)</text>

  <!-- Flagged traces -->
  <rect x="20" y="290" width="600" height="170" rx="8" fill="#ffffff" stroke="#9CA3AF"/>
  <text x="32" y="314" font-size="13" font-weight="700" fill="#111827">Flagged conversations to review this week</text>
  <g font-size="12" fill="#374151">
    <rect x="32" y="326" width="576" height="36" rx="4" fill="#F3F4F6"/>
    <text x="44" y="349">Hindi · refund · judge: FAIL · "promised date not in policy"</text>
    <rect x="560" y="334" width="40" height="20" rx="4" fill="#4F46E5"/>
    <text x="580" y="348" text-anchor="middle" font-size="11" fill="#ffffff">Open</text>

    <rect x="32" y="370" width="576" height="36" rx="4" fill="#F3F4F6"/>
    <text x="44" y="393">English · return · user asked for human · tool timeout</text>
    <rect x="560" y="378" width="40" height="20" rx="4" fill="#4F46E5"/>
    <text x="580" y="392" text-anchor="middle" font-size="11" fill="#ffffff">Open</text>

    <rect x="32" y="414" width="576" height="36" rx="4" fill="#F3F4F6"/>
    <text x="44" y="437">Hinglish · order status · came back in 48 h</text>
    <rect x="560" y="422" width="40" height="20" rx="4" fill="#4F46E5"/>
    <text x="580" y="436" text-anchor="middle" font-size="11" fill="#ffffff">Open</text>
  </g>
</svg>
