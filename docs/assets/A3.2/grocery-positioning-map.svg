<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" font-family="Inter, Arial, sans-serif">
  <rect width="640" height="480" fill="#ffffff"/>
  <text x="330" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">Ways to buy groceries: a positioning map</text>
  <text x="330" y="48" text-anchor="middle" font-size="11" fill="#6B7280">Illustrative, generic categories (not real companies or data)</text>
  <!-- axes -->
  <line x1="80" y1="420" x2="600" y2="420" stroke="#9CA3AF" stroke-width="2"/>
  <line x1="80" y1="420" x2="80" y2="70" stroke="#9CA3AF" stroke-width="2"/>
  <polygon points="600,420 590,414 590,426" fill="#9CA3AF"/>
  <polygon points="80,70 74,80 86,80" fill="#9CA3AF"/>
  <text x="340" y="448" text-anchor="middle" font-size="12" font-weight="600" fill="#4F46E5">SPEED: how soon you get it →</text>
  <text x="100" y="466" font-size="10" fill="#6B7280">next day or later</text>
  <text x="590" y="466" text-anchor="end" font-size="10" fill="#6B7280">within 15 minutes</text>
  <text x="34" y="245" text-anchor="middle" font-size="12" font-weight="600" fill="#4F46E5" transform="rotate(-90 34 245)">SELECTION: how many items →</text>
  <text x="54" y="410" text-anchor="middle" font-size="10" fill="#6B7280" transform="rotate(-90 54 410)">few</text>
  <text x="54" y="90" text-anchor="middle" font-size="10" fill="#6B7280" transform="rotate(-90 54 90)">many</text>
  <!-- gap zone -->
  <rect x="420" y="80" width="170" height="120" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="505" y="128" text-anchor="middle" font-size="13" font-weight="700" fill="#4F46E5">The contested gap</text>
  <text x="505" y="148" text-anchor="middle" font-size="11" fill="#374151">fast AND wide</text>
  <text x="505" y="166" text-anchor="middle" font-size="11" fill="#374151">everyone is racing here</text>
  <!-- options -->
  <circle cx="160" cy="120" r="34" fill="#F3F4F6" stroke="#6B7280"/>
  <text x="160" y="116" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">Scheduled</text>
  <text x="160" y="131" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">online grocery</text>
  <circle cx="270" cy="160" r="34" fill="#F3F4F6" stroke="#6B7280"/>
  <text x="270" y="156" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">Supermarket</text>
  <text x="270" y="171" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">trip</text>
  <circle cx="390" cy="320" r="34" fill="#F3F4F6" stroke="#6B7280"/>
  <text x="390" y="316" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">Kirana by</text>
  <text x="390" y="331" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">phone</text>
  <circle cx="540" cy="285" r="34" fill="#F3F4F6" stroke="#6B7280"/>
  <text x="540" y="281" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">Quick-commerce</text>
  <text x="540" y="296" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">app</text>
  <circle cx="480" cy="385" r="28" fill="#F3F4F6" stroke="#6B7280"/>
  <text x="480" y="381" text-anchor="middle" font-size="10" font-weight="600" fill="#111827">Vegetable</text>
  <text x="480" y="395" text-anchor="middle" font-size="10" font-weight="600" fill="#111827">cart</text>
  <!-- arrow showing movement -->
  <line x1="540" y1="250" x2="520" y2="208" stroke="#4F46E5" stroke-width="2"/>
  <polygon points="517,200 514,213 526,209" fill="#4F46E5"/>
  <text x="600" y="235" text-anchor="end" font-size="10" fill="#4F46E5">adding more items</text>
</svg>
