<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Inter, Arial, sans-serif" role="img" aria-label="Pyramid: mission, vision, strategy, goals, roadmap; meaning flows down, evidence flows up">
  <rect width="640" height="420" fill="#ffffff"/>
  <defs>
    <marker id="dn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4F46E5"/></marker>
    <marker id="up" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker>
  </defs>
  <text x="320" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">The vision stack</text>
  <!-- pyramid layers -->
  <polygon points="320,50 370,110 270,110" fill="#4F46E5"/>
  <text x="320" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Mission</text>
  <polygon points="270,116 370,116 420,176 220,176" fill="#E5E7EB" stroke="#9CA3AF"/>
  <text x="320" y="151" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">Vision</text>
  <polygon points="220,182 420,182 470,242 170,242" fill="#E5E7EB" stroke="#9CA3AF"/>
  <text x="320" y="217" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">Strategy</text>
  <polygon points="170,248 470,248 520,308 120,308" fill="#E5E7EB" stroke="#9CA3AF"/>
  <text x="320" y="283" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">Goals / OKRs</text>
  <polygon points="120,314 520,314 570,374 70,374" fill="#E5E7EB" stroke="#9CA3AF"/>
  <text x="320" y="345" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">Roadmap and backlog</text>
  <!-- side labels: question and speed -->
  <g font-size="11" fill="#374151">
    <text x="384" y="84">Why? (changes almost never)</text>
    <text x="434" y="150">Where? (2-10 years)</text>
    <text x="484" y="216">How? (yearly)</text>
    <text x="534" y="282">Result? (quarter)</text>
  </g>
  <text x="320" y="366" text-anchor="middle" font-size="11" fill="#374151">What and when? (continuous)</text>
  <text x="320" y="167" text-anchor="middle" font-size="10" fill="#374151">owner: CEO and head of product</text>
  <!-- arrows -->
  <line x1="40" y1="60" x2="40" y2="300" stroke="#4F46E5" stroke-width="3" marker-end="url(#dn)"/>
  <text x="30" y="180" font-size="12" font-weight="700" fill="#4F46E5" transform="rotate(-90 30 180)" text-anchor="middle">Meaning flows down</text>
  <line x1="610" y1="390" x2="610" y2="320" stroke="#6B7280" stroke-width="3" marker-end="url(#up)"/>
  <text x="600" y="404" font-size="12" font-weight="700" fill="#6B7280" text-anchor="end">Evidence flows up</text>
</svg>
