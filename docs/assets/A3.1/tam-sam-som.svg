<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="Inter, Arial, sans-serif">
  <rect width="640" height="460" fill="#ffffff"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">TAM, SAM and SOM</text>

  <!-- TAM -->
  <circle cx="230" cy="250" r="185" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="230" y="98" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">TAM</text>
  <text x="230" y="118" text-anchor="middle" font-size="12" fill="#374151">Everyone with the need</text>

  <!-- SAM -->
  <circle cx="230" cy="285" r="120" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="230" y="200" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">SAM</text>
  <text x="230" y="220" text-anchor="middle" font-size="12" fill="#374151">Who you can serve today</text>

  <!-- SOM -->
  <circle cx="230" cy="320" r="62" fill="#4F46E5"/>
  <text x="230" y="316" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">SOM</text>
  <text x="230" y="336" text-anchor="middle" font-size="11" fill="#ffffff">What you can win</text>
  <text x="230" y="351" text-anchor="middle" font-size="11" fill="#ffffff">in ~3 years</text>

  <!-- Cut labels -->
  <line x1="420" y1="120" x2="390" y2="150" stroke="#9CA3AF"/>
  <text x="430" y="100" font-size="13" font-weight="700" fill="#111827">TAM → SAM cuts</text>
  <text x="430" y="120" font-size="12" fill="#374151">• Regions you reach</text>
  <text x="430" y="138" font-size="12" fill="#374151">• Language, device</text>
  <text x="430" y="156" font-size="12" fill="#374151">• Size and price fit</text>
  <text x="430" y="174" font-size="12" fill="#374151">• Rules you can meet</text>

  <line x1="420" y1="300" x2="295" y2="320" stroke="#4F46E5"/>
  <text x="430" y="270" font-size="13" font-weight="700" fill="#4F46E5">SAM → SOM limits</text>
  <text x="430" y="290" font-size="12" fill="#374151">• Sales and marketing</text>
  <text x="430" y="308" font-size="12" fill="#374151">   capacity</text>
  <text x="430" y="326" font-size="12" fill="#374151">• Conversion rate</text>
  <text x="430" y="344" font-size="12" fill="#374151">• Churn</text>
  <text x="430" y="362" font-size="12" fill="#374151">• Competitors</text>

  <text x="320" y="450" text-anchor="middle" font-size="12" fill="#6B7280">Example: ₹360 cr TAM → ₹53 cr SAM → ₹1.9 cr SOM (illustrative)</text>
</svg>
