<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="Inter, Arial, sans-serif" role="img" aria-label="Porter's Five Forces diagram">
  <rect width="640" height="440" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker></defs>
  <text x="320" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">Porter's Five Forces</text>
  <!-- centre -->
  <rect x="230" y="180" width="180" height="80" rx="8" fill="#4F46E5"/>
  <text x="320" y="214" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Rivalry among</text>
  <text x="320" y="234" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">existing competitors</text>
  <!-- top -->
  <rect x="230" y="48" width="180" height="70" rx="8" fill="#F3F4F6" stroke="#9CA3AF"/>
  <text x="320" y="78" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">Threat of new entrants</text>
  <text x="320" y="98" text-anchor="middle" font-size="11" fill="#4B5563">How high are the barriers?</text>
  <!-- bottom -->
  <rect x="230" y="322" width="180" height="70" rx="8" fill="#F3F4F6" stroke="#9CA3AF"/>
  <text x="320" y="352" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">Threat of substitutes</text>
  <text x="320" y="372" text-anchor="middle" font-size="11" fill="#4B5563">Another way to meet the need?</text>
  <!-- left -->
  <rect x="20" y="185" width="170" height="70" rx="8" fill="#F3F4F6" stroke="#9CA3AF"/>
  <text x="105" y="215" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">Supplier power</text>
  <text x="105" y="235" text-anchor="middle" font-size="11" fill="#4B5563">Can they raise your costs?</text>
  <!-- right -->
  <rect x="450" y="185" width="170" height="70" rx="8" fill="#F3F4F6" stroke="#9CA3AF"/>
  <text x="535" y="215" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">Buyer power</text>
  <text x="535" y="235" text-anchor="middle" font-size="11" fill="#4B5563">Can they push prices down?</text>
  <!-- arrows -->
  <line x1="320" y1="118" x2="320" y2="176" stroke="#6B7280" stroke-width="2" marker-end="url(#a)"/>
  <line x1="320" y1="322" x2="320" y2="264" stroke="#6B7280" stroke-width="2" marker-end="url(#a)"/>
  <line x1="190" y1="220" x2="226" y2="220" stroke="#6B7280" stroke-width="2" marker-end="url(#a)"/>
  <line x1="450" y1="220" x2="414" y2="220" stroke="#6B7280" stroke-width="2" marker-end="url(#a)"/>
  <text x="320" y="420" text-anchor="middle" font-size="11" fill="#6B7280">Each outer force can take a slice of the value the industry creates. Source: Porter (HBR 1979, 2008).</text>
</svg>
