<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="Inter, Arial, sans-serif" role="img" aria-label="SWOT grid leading into a TOWS matrix">
  <rect width="680" height="360" fill="#ffffff"/>
  <defs><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4F46E5"/></marker></defs>
  <text x="160" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">SWOT: the lists</text>
  <text x="520" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">TOWS: the choices</text>
  <!-- SWOT -->
  <g font-size="13">
    <rect x="20" y="50" width="140" height="120" fill="#F3F4F6" stroke="#9CA3AF"/>
    <text x="90" y="80" text-anchor="middle" font-weight="700" fill="#111827">Strengths</text>
    <text x="90" y="100" text-anchor="middle" font-size="11" fill="#4B5563">internal, helpful</text>
    <rect x="160" y="50" width="140" height="120" fill="#F3F4F6" stroke="#9CA3AF"/>
    <text x="230" y="80" text-anchor="middle" font-weight="700" fill="#111827">Weaknesses</text>
    <text x="230" y="100" text-anchor="middle" font-size="11" fill="#4B5563">internal, harmful</text>
    <rect x="20" y="170" width="140" height="120" fill="#E5E7EB" stroke="#9CA3AF"/>
    <text x="90" y="200" text-anchor="middle" font-weight="700" fill="#111827">Opportunities</text>
    <text x="90" y="220" text-anchor="middle" font-size="11" fill="#4B5563">external, helpful</text>
    <rect x="160" y="170" width="140" height="120" fill="#E5E7EB" stroke="#9CA3AF"/>
    <text x="230" y="200" text-anchor="middle" font-weight="700" fill="#111827">Threats</text>
    <text x="230" y="220" text-anchor="middle" font-size="11" fill="#4B5563">external, harmful</text>
  </g>
  <line x1="310" y1="170" x2="352" y2="170" stroke="#4F46E5" stroke-width="3" marker-end="url(#b)"/>
  <!-- TOWS -->
  <g font-size="12">
    <rect x="360" y="50" width="150" height="120" fill="#ffffff" stroke="#4F46E5" stroke-width="2"/>
    <text x="435" y="85" text-anchor="middle" font-weight="700" fill="#4F46E5">SO: attack</text>
    <text x="435" y="108" text-anchor="middle" fill="#374151">Use a strength to</text>
    <text x="435" y="124" text-anchor="middle" fill="#374151">grab an opportunity</text>
    <rect x="510" y="50" width="150" height="120" fill="#ffffff" stroke="#4F46E5" stroke-width="2"/>
    <text x="585" y="85" text-anchor="middle" font-weight="700" fill="#4F46E5">WO: fix to grow</text>
    <text x="585" y="108" text-anchor="middle" fill="#374151">Fix a weakness to</text>
    <text x="585" y="124" text-anchor="middle" fill="#374151">take an opportunity</text>
    <rect x="360" y="170" width="150" height="120" fill="#ffffff" stroke="#4F46E5" stroke-width="2"/>
    <text x="435" y="205" text-anchor="middle" font-weight="700" fill="#4F46E5">ST: defend</text>
    <text x="435" y="228" text-anchor="middle" fill="#374151">Use a strength to</text>
    <text x="435" y="244" text-anchor="middle" fill="#374151">blunt a threat</text>
    <rect x="510" y="170" width="150" height="120" fill="#ffffff" stroke="#4F46E5" stroke-width="2"/>
    <text x="585" y="205" text-anchor="middle" font-weight="700" fill="#4F46E5">WT: avoid</text>
    <text x="585" y="228" text-anchor="middle" fill="#374151">Cut exposure where</text>
    <text x="585" y="244" text-anchor="middle" fill="#374151">weak and threatened</text>
  </g>
  <text x="340" y="330" text-anchor="middle" font-size="12" fill="#6B7280">Pick 1-2 options from the right side and turn them into outcomes and metrics.</text>
</svg>
